
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành bảng trong CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

            <thead>

                    <th>Họ tên</th>
                    <th>Tuổi</th>
                    <th>Lớp</th>
                    <th>Điểm trung bình</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Nguyễn Văn A</td>
                    <td>20</td>
                    <td>Web</td>
                    <td>8.5</td>
                </tr>
                <tr>
                    <td>Trần Thị B</td>
                    <td>21</td>
                    <td>Web</td>
                    <td>9.0</td>
                </tr>
                <tr>
                    <td>Lê Văn C</td>
                    <td>19</td>
                    <td>Web</td>
                    <td>7.8</td>
                </tr>
                <tr>
                    <td>Phạm Thị D</td>
                    <td>20</td>
                    <td>Web</td>
                    <td>8.8</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
