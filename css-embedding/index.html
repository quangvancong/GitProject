
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành nhúng CSS</title>

    <!-- Phần 2: Internal CSS -->
    <style>
        .internal-style {
            color: green;
        }
    </style>

    <!-- Phần 3: External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Bài tập nhúng CSS vào trang HTML</h1>

    <!-- Phần 1: Inline CSS -->
    <p style="color: red;">
        Phần 1: Đây là đoạn văn sử dụng Inline CSS (màu đỏ).
    </p>

    <!-- Phần 2: Internal CSS -->
    <p class="internal-style">
        Phần 2: Đây là đoạn văn sử dụng Internal CSS (màu xanh lá).
    </p>

    <!-- Phần 3: External CSS -->
    <p class="external-style">
        Phần 3: Đây là đoạn văn sử dụng External CSS (màu xanh dương).
    </p>
</body>
</html>
