
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch họp công ty</title>
</head>
<body>
    <h1>Lịch họp công ty</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>

        <tr>
            <td rowspan="3">Thứ Hai</td>
            <td>08:00 - 09:00</td>
            <td>Họp đầu tuần</td>
        </tr>
        <tr>
            <td>09:00 - 10:00</td>
            <td>Phân công công việc</td>
        </tr>
        <tr>
            <td>10:00 - 11:00</td>
            <td>Đánh giá tiến độ dự án</td>
        </tr>

        <tr>
            <td rowspan="2">Thứ Ba</td>
            <td>08:00 - 10:00</td>
            <td rowspan="2">Họp với khách hàng</td>
        </tr>
        <tr>
            <td>10:00 - 11:00</td>
        </tr>

        <tr>
            <td>Thứ Tư</td>
            <td colspan="2">08:00 - 10:00: Đào tạo nội bộ (cuộc họp kéo dài 2 giờ)</td>
        </tr>
    </table>
</body>
</html>
